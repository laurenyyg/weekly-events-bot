name: Vancouver Tech Events (Weekly)

on:
  schedule:
    - cron: "0 4 * * 0"  # Every Sunday 04:00 UTC (Sat 9:00 PM PDT)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tech events bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TECH_WEBHOOK_URL: ${{ secrets.TECH_WEBHOOK_URL }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          LOGIN: ${{ secrets.LOGIN }}
          PW: ${{ secrets.PW }}
        run: python main.py --profile tech
