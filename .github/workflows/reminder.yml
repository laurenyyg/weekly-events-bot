name: Weekly Tech Events Reminder

on:
  schedule:
    - cron: "0 16 * * 6"  # Every Saturday 16:00 UTC (9:00 AM PDT / 8:00 AM PST)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Post Slack reminder
        env:
          TECH_WEBHOOK_URL: ${{ secrets.TECH_WEBHOOK_URL }}
        run: |
          curl -X POST "$TECH_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":calendar: *Reminder:* Run the Vancouver Tech Events bot for this week'\''s digest.\n<https://github.com/laurengyu/ly-vancouver-events-bot/actions/workflows/tech_events.yml|Click here to trigger the workflow>"
                  }
                }
              ]
            }'
