name: Vancouver Fun Events (Bi-weekly)

on:
  schedule:
    # Keep runs outside DeepSeek peak hours (Mon–Fri 01:00–04:00 and 06:00–10:00 UTC),
    # which cost 2x. Weekends are entirely off-peak.
    - cron: "5 8 * * 0"  # Every Sunday 08:05 UTC (Sun 00:05 PST / 01:05 PDT)
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # GitHub cron can't express "every other week", so scheduled runs skip alternate
      # weeks here. Weeks are counted since the Unix epoch rather than ISO week numbers,
      # which repeat parity across 53-week years (week 53 → week 1) and would skip twice.
      # Odd epoch weeks run, matching the previous even-ISO-week Sundays (e.g. 2026-11-15).
      - name: Check if this is a run week
        id: week_check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run — skipping the bi-weekly check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EPOCH_WEEK=$(( $(date -u +%s) / 604800 ))
          echo "Epoch week: $EPOCH_WEEK"
          if (( EPOCH_WEEK % 2 == 1 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Off week — skipping fun events run."
          fi

      - name: Run fun events bot
        if: steps.week_check.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FUN_WEBHOOK_URL: ${{ secrets.FUN_WEBHOOK_URL }}
        run: python main.py --profile fun
