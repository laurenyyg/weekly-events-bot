name: Vancouver Fun Events (Bi-weekly)

on:
  schedule:
    # Keep runs outside DeepSeek peak hours (Mon–Fri 01:00–04:00 and 06:00–10:00 UTC),
    # which cost 2x. Weekends are entirely off-peak.
    - cron: "5 8 * * 0"  # Every Sunday 08:05 UTC (Sun 00:05 PST / 01:05 PDT)
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if this is an even-numbered week
        id: week_check
        run: |
          WEEK=$(date +%V | sed 's/^0*//')
          echo "Week number: $WEEK"
          if (( WEEK % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Odd week — skipping fun events run."
          fi

      - name: Run fun events bot
        if: steps.week_check.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FUN_WEBHOOK_URL: ${{ secrets.FUN_WEBHOOK_URL }}
        run: python main.py --profile fun
